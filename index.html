 <form id=cf><input type=hidden name=id><label>Name</label><input name=name required><label>Role</label><input name=role><div class=two><div><label>Phone</label><input name=phone required inputmode=tel></div><div><label>WhatsApp (with country code)</label><input name=whatsapp></div></div><label>Email</label><input name=email type=email>
 <div class=two><div><label>Order</label><input name=sort type=number value=0></div><div><label>Show publicly</label><select name=public><option value=true>Yes</option><option value=false>No</option></select></div></div><button>Save contact</button></form></div>
 <div data-t=sa hidden><p class=mut>Step 1: in Supabase → Authentication → Users → Add user (email + password). Step 2: copy that user's UID and add them below.</p>${tbl(['Name','Role','Active',''],pf.map(p=>{const self=p.id===me.id;return[E(p.full_name||'—')+(self?' <span class=tag>you</span>':'')+'<br><small>'+E(p.id)+'</small>',`<select id="r_${p.id}" ${self?'disabled':''}>${opts(['admin','staff'],p.role)}</select>`,`<select id="a_${p.id}" ${self?'disabled':''}><option value=true ${p.active?'selected':''}>Active</option><option value=false ${p.active?'':'selected'}>Disabled</option></select>`,self?'':`<button onclick="saveProf('${p.id}')">Save</button>`]}))}
 <form id=pform><label>User UID (from Supabase)</label><input name=id required pattern="[0-9a-fA-F-]{36}" placeholder="2d3df09f-0f14-…"><label>Name</label><input name=full_name required><label>Role</label><select name=role><option>staff</option><option>admin</option></select><button>Add staff member</button></form></div>
 <div data-t=qr hidden><p>Points to <code>${E(url)}</code>. It never changes, so print it once.</p><div style="max-width:260px;background:#fff">${svg}</div><button id=dq>Download QR (SVG)</button><button id=pp class=or>🖨️ Print poster</button><button id=cp class=s>Copy link</button></div>
 <div data-t=al hidden id=alog><p class=mut>Loading…</p></div>
 <div data-t=ex hidden><p class=mut>Exports contain personal data – keep them private.</p><button data-x=items>Equipment CSV</button><button data-x=beneficiaries>Beneficiaries CSV</button><button data-x=loans>Loan history CSV</button><hr><button id=bk class=tl>⬇ Full backup (JSON)</button><p class=mut>Download a backup regularly (e.g. monthly) and store it somewhere private.</p></div></div>`;
 let logged=0;const logLoad=async()=>{if(logged)return;logged=1;const{data}=await run(sb.from('audit_log').select('*').order('at',{ascending:false}).limit(150)),nm={};pf.forEach(p=>nm[p.id]=p.full_name||p.id.slice(0,8));
  const act={INSERT:'Added',UPDATE:'Changed',DELETE:'Deleted',DELETE_REASON:'Delete reason'};$('#alog').innerHTML=tbl(['When','Who','Action','Record','Details'],data.map(a=>[dt(a.at),E(nm[a.actor]||'—'),E(act[a.op]||a.op),E(a.tbl),E(a.data?.ref||a.data?.code||a.data?.full_name||a.data?.name||'')+'<br><small>'+E(a.data?.reason||'')+'</small>',]))};
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b));el.querySelectorAll('[data-t]').forEach(d=>d.hidden=d.dataset.t!==b.dataset.p);if(b.dataset.p==='al')logLoad()});
 $('#sf').onsubmit=async e=>{e.preventDefault();await run(sb.from('settings').upsert({id:1,...fd(e.target)}),'Saved')};
 window.editC=id=>{const c=cs.find(x=>x.id===id),f=$('#cf');for(const k in c)if(f.elements[k])f.elements[k].value=String(c[k]??'');f.scrollIntoView()};
 window.delC=async id=>{if(confirm('Remove this contact?')){await run(sb.from('contacts').delete().eq('id',id),'Removed');settings(el,me)}};
 $('#cf').onsubmit=async e=>{e.preventDefault();const o=fd(e.target),id=o.id;delete o.id;o.public=o.public!=='false';await run(id?sb.from('contacts').update(o).eq('id',id):sb.from('contacts').insert(o),'Contact saved');settings(el,me)};
 window.saveProf=async id=>{await run(sb.from('profiles').update({role:$('#r_'+id).value,active:$('#a_'+id).value==='true'}).eq('id',id),'Staff account updated');settings(el,me)};
 $('#pform').onsubmit=async e=>{e.preventDefault();await run(sb.from('profiles').insert(fd(e.target)),'Staff member added');settings(el,me)};
 $('#dq').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='sahachari-qr.svg';a.click()};
 $('#cp').onclick=()=>navigator.clipboard.writeText(url).then(()=>toast('Link copied'),()=>toast(url));
 $('#pp').onclick=()=>printOut(`<div class=poster><img class=l src="${LOGO_S}" alt=""><h1>Sahachari</h1><p><b>Free medical &amp; mobility equipment</b></p><p>Wheelchairs · Walkers · Air beds · Commode chairs · and more</p><div class=q>${svg}</div><p><b>Scan to see what is available today</b></p><p>Lent free of charge · An initiative of SKSSF Alungal Unit</p></div>`);
 el.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const t=b.dataset.x,{data}=await run(sb.from(t).select(t==='loans'?'*,items(code,name),beneficiaries(ref,full_name,phone)':'*').limit(10000));csv(t,data)});
 $('#bk').onclick=async()=>{const o={exported_at:new Date().toISOString()};for(const t of['items','beneficiaries','loans','contacts','settings','profiles','audit_log']){const{data}=await run(sb.from(t).select('*').limit(100000));o[t]=data}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='sahachari-backup-'+today()+'.json';a.click();toast('Backup downloaded – store it privately')};
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
